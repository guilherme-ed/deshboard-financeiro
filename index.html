<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Deshboard Financeiro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <header class="cabecalho">
        <h1>Menu Financeiro</h1>
        <p>Controle suas finanças com inteligência. </p>
    </header>

    <main class="dshboard">
        <section class="resumo">
            <article class="card">
                <h2>Saldo atual</h2>
                <p id="saldo">R$:0,00</p>
            </article>

            <article class="card">
                <h2>Receitas</h2>
                <p id="receitas">R$:0,00</p>
            </article>

            <article class="card">
                <h2>Despesas</h2>
                <p id="despesas">R$:0,00</p>
            </article>
        </section>

        <section class="transacao">
            <h2>Adicionar lançamento</h2>

            <form id="form-transacao">
                <label for="descricao">Descrição</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex.: Conta de luz"
                    required
                >

                <label for="valor">Valor (R$)</label>
                <input
                    type="number"
                    id="valor"
                    min="0.01"
                    step="0.01"
                    placeholder="Ex.: 150,00"
                    required
                >

                <label for="tipo">Tipo de lançamento</label>
                <select id="tipo" required>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
                
                <label for="categoria">Categoria</label>
                <select id="categoria" required>
                    <option value="alimentacao">Alimentação</option>
                    <option value="transporte">Transporte</option>
                    <option value="moradia">Moradia</option>
                    <option value="saude">Saúde</option>
                    <option value="lazer">Lazer</option>
                    <option value="educacao">Educação</option>
                    <option value="salario">Salário</option>
                    <option value="outros">Outros</option>
                </select>

                <label for="data">Data do lançamento</label>
                <input
                    type="date"
                    id="data"
                    required
                >

                <button type="submit">Adcionar lançamento</button>
            </form>
        </section>

        <section class="historico">
            <h2>Últimos lançamentos</h2>

            <ul id="lista-transacoes">
                <li>Nenhum lançamento cadastrado.</li>
            </ul>
        </section>

    </main>
    
</body>
</html>
